<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; background: #556; font: 12px monospace; }
      iframe { display: block; border: 0; background: #fff; }
    </style>
  </head>
  <body>
    <script>
      // /diag.html?w=390&h=1400&path=/nareum%3Fdate%3D2026-08-25
      const q = new URLSearchParams(location.search);
      const w = Number(q.get("w") || 390);
      const h = Number(q.get("h") || 1400);
      const path = q.get("path") || "/nareum?date=2026-08-25";
      const f = document.createElement("iframe");
      f.width = w;
      f.height = h;
      f.src = path;
      document.body.appendChild(f);
    </script>
  </body>
</html>
